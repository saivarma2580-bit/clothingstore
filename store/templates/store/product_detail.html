<!DOCTYPE html>
<html>
<head>
  <title>{{ product.name }} — StyleHub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    header { background: #1a1a2e; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 24px; }
    nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; }
    .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .product { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; background: white; border-radius: 16px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .product img { width: 100%; border-radius: 12px; object-fit: cover; }
    .no-image { width: 100%; height: 350px; background: #e0e0e0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 80px; }
    .info h2 { font-size: 28px; margin-bottom: 10px; }
    .info .category { color: #888; font-size: 13px; margin-bottom: 16px; }
    .info .price { font-size: 32px; font-weight: bold; color: #1a1a2e; margin-bottom: 20px; }
    .info .desc { color: #555; line-height: 1.6; margin-bottom: 24px; }
    .info .stock { font-size: 13px; color: #10B981; margin-bottom: 20px; }
    .btn { display: block; text-align: center; padding: 14px; background: #1a1a2e; color: white; text-decoration: none; border-radius: 10px; font-size: 16px; font-weight: bold; }
    .btn:hover { background: #16213e; }
    .back { display: inline-block; margin-bottom: 20px; color: #1a1a2e; text-decoration: none; font-size: 14px; }
    .magnetic-text span { display: inline-block; transition: transform 0.15s ease, color 0.15s ease; }
  </style>
</head>
<body>

<header>
  <h1>👗 StyleHub</h1>
  <nav>
    <a href="/">Home</a>
    <a href="/cart/">Cart 🛒</a>
  </nav>
</header>

<div class="container">
  <a href="/" class="back">← Back to Products</a>

  <div class="product">
    <div>
      {% if product.image %}
      <img src="{{ product.image.url }}" alt="{{ product.name }}">
      {% else %}
      <div class="no-image">👕</div>
      {% endif %}
    </div>
    <div class="info">
      <div class="category">{{ product.category }}</div>
      <h2 class="magnetic-text" id="productTitle"></h2>
      <div class="price">S${{ product.price }}</div>
      <div class="desc">{{ product.description }}</div>
      <div class="stock">✅ {{ product.stock }} items in stock</div>
      <div style="margin-bottom:16px;font-size:14px;color:#555;">Size: <strong>{{ product.sizes }}</strong></div>
      <a href="/add-to-cart/{{ product.pk }}/" class="btn">🛒 Add to Cart</a>
    </div>
  </div>
</div>
<script>
  // Split product name into letters
  const title = "{{ product.name }}";
  const titleEl = document.getElementById('productTitle');
  titleEl.innerHTML = title.split('').map(c =>
    c === ' ' ? '<span>&nbsp;</span>' : `<span>${c}</span>`
  ).join('');

  document.querySelectorAll('.magnetic-text span').forEach(letter => {
    document.addEventListener('mousemove', (e) => {
      const rect = letter.getBoundingClientRect();
      const distX = e.clientX - (rect.left + rect.width / 2);
      const distY = e.clientY - (rect.top + rect.height / 2);
      const distance = Math.sqrt(distX * distX + distY * distY);
      const maxDist = 150;
      if (distance < maxDist) {
        const force = (maxDist - distance) / maxDist;
        letter.style.transform = `translate(${-distX * force * 0.4}px, ${-distY * force * 0.4}px)`;
        letter.style.color = `#a78bfa`;
      } else {
        letter.style.transform = 'translate(0, 0)';
        letter.style.color = '';
      }
    });
  });
</script>
</body>
</html>
