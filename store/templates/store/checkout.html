<!DOCTYPE html>
<html>
<head>
  <title>Checkout — StyleHub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    header { background: #1a1a2e; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 24px; }
    nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; }
    .container { max-width: 900px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; }
    h2 { font-size: 22px; margin-bottom: 24px; }
    .back { display: inline-block; margin-bottom: 20px; color: #1a1a2e; text-decoration: none; font-size: 14px; }
    .card { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 6px; text-transform: uppercase; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #1a1a2e; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .submit-btn { width: 100%; padding: 14px; background: #1a1a2e; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .submit-btn:hover { background: #16213e; }
    .order-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .order-item:last-child { border-bottom: none; }
    .total-row { display: flex; justify-content: space-between; padding: 16px 0 0; font-size: 18px; font-weight: bold; color: #1a1a2e; border-top: 2px solid #eee; margin-top: 8px; }
  </style>
</head>
<body>

<header>
  <h1>👗 StyleHub</h1>
  <nav>
    <a href="/">Home</a>
    <a href="/cart/">Cart 🛒</a>
  </nav>
</header>

<div style="max-width:900px;margin:20px auto;padding:0 20px;">
  <a href="/cart/" class="back">← Back to Cart</a>
</div>

<div class="container">
  <!-- FORM -->
  <div class="card">
    <h2 class="magnetic-text"><span>📦</span><span>S</span><span>h</span><span>i</span><span>p</span><span>p</span><span>i</span><span>n</span><span>g</span><span>&nbsp;</span><span>D</span><span>e</span><span>t</span><span>a</span><span>i</span><span>l</span><span>s</span></h2>
    <form method="POST">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" name="first_name" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" name="last_name" required>
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea name="address" rows="2" required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>City</label>
          <input type="text" name="city" required>
        </div>
        <div class="form-group">
          <label>Postal Code</label>
          <input type="text" name="postal_code" required>
        </div>
      </div>
      <button type="submit" class="submit-btn">✅ Place Order</button>
    </form>
  </div>

  <!-- ORDER SUMMARY -->
  <div class="card">
    <h2>🧾 Order Summary</h2>
    {% for item in items %}
    <div class="order-item">
      <span>{{ item.product.name }} × {{ item.quantity }}</span>
      <span>S${{ item.get_subtotal }}</span>
    </div>
    {% endfor %}
    <div class="total-row">
      <span>Total</span>
      <span>S${{ cart.get_total }}</span>
    </div>
  </div>
</div>

</body>
</html>
